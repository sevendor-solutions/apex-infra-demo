version: '3.8'

# ═══════════════════════════════════════════════════════════════
#  Apex Infra — Docker Compose for Dokploy (IP-based, no domain)
#  Frontend: http://200.97.162.130:3001
#  Backend:  http://200.97.162.130:3002
# ═══════════════════════════════════════════════════════════════

services:

  # ──────────────────────────────────────────────
  # FRONTEND — React app served by Nginx
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://200.97.162.130:3002}
    container_name: apex-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - apex-network

  # ──────────────────────────────────────────────
  # BACKEND — Laravel API served by Nginx + PHP-FPM
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3002}:8000"
    environment:
      APP_NAME: "Apex Infra"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://200.97.162.130:3002}
      APP_KEY: ${APP_KEY:-base64:FjcIkxYrKUDxjoeTVTk4+pvAa4MvVOFBlHA4b9lK/FY=}

      # Database — SQLite (no extra service needed)
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: /var/www/html/database/database.sqlite

      # Mail
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-smtpout.secureserver.net}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-info@apexinfra.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-info@apexinfra.com}
      MAIL_FROM_NAME: "Apex Infra"

    volumes:
      # Persist uploaded images and SQLite database between restarts
      - apex-uploads:/var/www/html/public/uploads
      - apex-storage:/var/www/html/storage
      - apex-database:/var/www/html/database

    networks:
      - apex-network

# ──────────────────────────────────────────────
# VOLUMES — persisted data
# ──────────────────────────────────────────────
volumes:
  apex-uploads:
    driver: local
  apex-storage:
    driver: local
  apex-database:
    driver: local

# ──────────────────────────────────────────────
# NETWORKS
# ──────────────────────────────────────────────
networks:
  apex-network:
    driver: bridge
